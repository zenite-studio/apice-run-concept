# Vigia de segurança do repositório. Regra da Zênite: o repo tem que ser seguro
# mesmo se um dia ficar público. Em todo PR e em todo push na master:
#  1. nenhum segredo no histórico (gitleaks + .gitleaks.toml);
#  2. nenhuma dependência com vulnerabilidade conhecida (npm audit).
# O plano grátis do GitHub não tem varredura nativa de segredo em repo privado: é esta CI que faz o papel.
name: Segurança

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  seguranca:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Nenhum segredo no histórico (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # Repo pequeno e com histórico limpo (varredura completa em 29/09/2026):
          # varre tudo, não só os commits do PR.
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Nenhuma dependência com vulnerabilidade conhecida
        run: npm audit --audit-level=low
